<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Homepage</title>
</head>
<body>
    <header id="nav-bar">
        <button id="logo"></button>
        <button class="button">Features</button>
        <button class="button">How it works</button>
        <button class="button">About</button>
        <button class="button">Sign In</button>
        <button class="button">Get Started</button>
    </header>


    <div id="mainSection">

        <div id="heroSection">

            <div id="images">
                <div id="image"></div>
            </div>

            <div id="heroSectionTextArea">

                <div id="heroSectionHeader">
                    <h1 class="heading">Build Projects.</h1>
                    <h1 class="heading">Track Progress.</h1>
                    <h1 class="heading">Collaborate Better.</h1>
                </div>

                <p class="para">DevFlow helps developers manage projects, organize tasks, collaborate with teammates, and stay focused-all from one clean workspace.</p>

                <div id="heroButtonContainer">
                    <button class="button" id="heroButton1">Get Started</button>
                    <button class="button" id="heroButton2">Learn more</button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
