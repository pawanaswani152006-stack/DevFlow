<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Sign In</title>
</head>
<body>
    <form>
        <div id="form">

            <div id="formElementsContainer">

                <h1 class="formHeading">Welcome Back</h1>

                <div id="elements">

                    <div>

                        <p class="para">Email</p>

                        <input type="email" placeholder="example@gmail.com">

                    </div>

                    <div>

                        <p class="para">Password</p>

                        <input type="password" placeholder="Enter your password">

                        <div id="forgotBtnContainer">

                            <button id="forgotBtn">Forgot Password</button>
                        </div>

                    </div>

                </div>

                <div class="submit">

                    <button type="submit" class="sign">Sign In</button>

                </div>

                <div class="create">

                    <p class="para2">New to DevFlow? <button class="createBtn" id="createBtn1">Create an account</button></p>

                </div>

            </div>


            <div id="formElementContainer2">

                <h1 class="formHeading" id="formHeading2">Create Account</h1>

                <div id="elements2">

                    <div style="margin-top:10px;">

                        <p class="para para22">Full Name</p>

                        <input type="text" placeholder="John Doe">

                    </div>

                    <div style="margin-top:25px;">

                        <p class="para para22">Email</p>

                        <input type="email" placeholder="name@example.com">

                    </div>

                    <div style="margin-top:25px;">

                        <p class="para para22">Password</p>

                        <input type="password" placeholder="At least 8 characters">

                    </div>

                    <div style="margin-top:25px;">

                        <p class="para para22">Confirm Password</p>

                        <input type="password" placeholder="Re-enter your password">

                    </div>

                </div>

                <div class="submit" id="submit2">

                    <button type="submit" class="sign" id="sign2">Create Account</button>

                </div>

                <div class="create" id="create2">

                    <p class="para2">Already have an account? <button class="createBtn">Sign In</button></p>

                </div>

            </div>

        </div>

    </form>

    <script src="script2.js"></script>

</body>
</html>
