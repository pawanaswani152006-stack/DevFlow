<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Dashboard</title>
</head>
<body>
    <header id="navBar">
        <div id="navLogoContainer">
            <div id="logo"></div>
            <p id="navLogoPara">DevFlow</p>
        </div>
        <div id="searchContainer">
            <div id="searchIconContainer">
                <i id="searchIcon" class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input id="navInput" type="text" placeholder="Search by project name...">
        </div>  
        <button id="createButton"><span id="newIcon">+</span><pre> New Project</pre></button>
        <button id="option">👤</button>
    </header>

    <div id="welcomeSection">
        <p id="welcomePara1"></p>
        <p id="welcomePara2">Ready to continue building today?</p>
        <div id="filterContainer">
            <p id="welcomePara3">Choose a project to continue...</p>
            <div id="filterButtonContainer">
                <button class="filterButton" id="allButton">All</button>
                <button class="filterButton" id="activeButton">Active</button>
                <button class="filterButton" id="completedButton">Completed</button>
            </div>
        </div>
    </div>
    <hr>
    <div id="grid">
        <h1 class="gridEmptyState" id="gridHeading"><span style="font-size:3rem;">📁</span> No Projects Yet</h1>
        <p class="gridEmptyState" id="gridPara1">Your workspace is waiting.</p>
        <p class="gridEmptyState" id="gridPara2">Create your first project to start building.</p>
    </div>
    <form id="form" method="post" action="/dashboard/projects">
        <div id="newProjectHolder">
            <div id="newProject">
                <div id="newProjectHeading">Create Project</div>
                <div id="newProjectDataContainer">
                    <div style="margin-bottom:40px;">
                        <p class="newPara">Project Name</p>
                        <input required type="text" placeholder="Enter your project's name" class="newInput" id="projectName"> 
                    </div>
                    <div id="dateBox" style="margin-bottom:40px;">
                        <p class="newPara" style="margin-bottom:0px;margin-right:20px;">Deadine</p>
                        <input required type="date" placeholder="Your project's deadline" id="date"> 
                    </div>
                    <div style="margin-bottom:40px;">
                        <p class="newPara" style="margin-bottom:15px;">Tracking Mode</p>
                        <div id="selection">
                            <label>
                                <input required type="radio" value="taskBased" name="Mode" id="taskBased" >Task Based
                            </label>
                            <label>
                                <input required type="radio" value="manual" name="Mode" id="manual">Manual
                            </label>
                        </div>

                    </div>
                    <div style="margin-bottom:20px;">
                        <p class="newPara">Description</p>
                        <textarea required maxlength="80" placeholder="Maximum 80 characters" class="newInput" id="textArea"></textarea>
                    </div>
                </div>

                <div id="newButtonHolder">
                    <button type="submit" class="newButton" id="newProjectCreateButton">Create</button>
                    <button type="button" class="newButton" id="newProjectCancelButton">Cancel</button>
                </div>

            </div>
         </div>
    </form>
    <script src="/script3.js"></script>
</body>
</html>
